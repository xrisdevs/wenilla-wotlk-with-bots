[supervisord]
nodaemon=true
logfile=/persist/logs/supervisor.log
pidfile=/run/arena/supervisord.pid
user=root

[program:mysql]
command=mysqld --user=mysql --datadir=/persist/mysql --bind-address=127.0.0.1 --socket=/run/mysqld/mysqld.sock --mysqlx=0 --max-allowed-packet=256M --innodb-buffer-pool-size=512M
priority=10
autorestart=true
stopwaitsecs=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:auth]
command=/opt/trinitycore/bin/authserver -c /run/arena/authserver.conf
priority=20
autorestart=true
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:world]
command=/opt/trinitycore/bin/worldserver -c /run/arena/worldserver.conf
priority=20
autorestart=true
startretries=30
stopwaitsecs=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
command=/usr/local/bin/wenilla-host --bind 127.0.0.1:8092 --www /app/www --data /persist/game-data --upstream 127.0.0.1
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:lobby]
command=/opt/venv/bin/python /app/controller/lobby/service.py --bind 0.0.0.0 --port 8090
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
