[package]
name = "wenilla-arena-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
benilla-formats = { path = "../../client/benilla-src/crates/benilla-formats", default-features = false }
wenilla-host = { path = "../../client/benilla-src/crates/wenilla-host" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
num-bigint = "0.4"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
roxmltree = "0.20"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "sqlite"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
