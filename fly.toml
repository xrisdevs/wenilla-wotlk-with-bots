app = "your-arena-app"
primary_region = "lhr"
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  dockerfile = "deploy/fly/Dockerfile"

[env]
  ARENA_PUBLIC_ORIGIN = "https://your-arena-app.fly.dev"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 300
  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "arena_data"
  destination = "/persist"

[[vm]]
  cpu_kind = "shared"
  cpus = 4
  memory = "8gb"
